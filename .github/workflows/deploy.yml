name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: build_placeholder
          SCRAPER_EMAIL: build_placeholder
          SCRAPER_PASSWORD: build_placeholder
          SCRAPER_API_KEY: build_placeholder

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r .next/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/sintak/.next-tmp/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /var/www/sintak && rm -rf .next.bak && mv .next .next.bak && mv .next-tmp .next && pm2 restart sintak-prod"
