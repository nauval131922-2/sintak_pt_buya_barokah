name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          SESSION_SECRET: build_placeholder
          SCRAPER_EMAIL: build_placeholder
          SCRAPER_PASSWORD: build_placeholder
          SCRAPER_API_KEY: build_placeholder
      
      - name: Remove build cache before deploy
        run: rm -rf .next/cache

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .next/
          target: /var/www/sintak/.next-tmp/
          strip_components: 0

      - name: Swap .next and restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/sintak
            rm -rf .next.bak
            touch .maintenance
            mv .next .next.bak
            mv .next-tmp/.next .next
            rmdir .next-tmp
            pm2 reload ecosystem.config.js --only sintak-prod

            for i in $(seq 1 30); do
              sleep 1
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 http://localhost:3000/login 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                rm -f .maintenance
                echo "Health OK"
                exit 0
              fi
            done

            echo "Health FAILED - rolling back"
            mv .next .next-failed
            mv .next.bak .next
            rm -f .maintenance
            pm2 reload ecosystem.config.js --only sintak-prod
            exit 1
