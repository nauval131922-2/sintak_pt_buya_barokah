name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          SESSION_SECRET: build_placeholder
          SCRAPER_EMAIL: build_placeholder
          SCRAPER_PASSWORD: build_placeholder
          SCRAPER_API_KEY: build_placeholder
      
      - name: Remove build cache before deploy
        run: rm -rf .next/cache

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 10m
          source: .next/
          target: /var/www/sintak/.next-tmp/
          strip_components: 0

      - name: Swap .next and restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd /var/www/sintak

            # Cek apakah build baru valid
            if [ ! -d ".next-tmp/.next" ] || [ ! -f ".next-tmp/.next/BUILD_ID" ]; then
              echo "No valid build in .next-tmp/.next"
              rm -rf .next-tmp 2>/dev/null
              rm -f .maintenance
              if [ -d ".next" ] && [ -f ".next/BUILD_ID" ]; then
                pm2 reload ecosystem.config.js --only sintak-prod
                echo "Restarted existing build"
              else
                echo "No valid build available — app may be down"
              fi
              exit 1
            fi

            touch .maintenance

            # Backup current build (jangan hapus sampai health check lolos)
            rm -rf .next.bak
            [ -d ".next" ] && mv .next .next.bak
            # rm target biar gak nesting: mv existing-dir new-dir → new-dir/existing-dir
            rm -rf .next 2>/dev/null || true

            # Swap new build
            mv .next-tmp/.next .next
            rmdir .next-tmp 2>/dev/null

            pm2 reload ecosystem.config.js --only sintak-prod

            for i in $(seq 1 30); do
              sleep 1
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://localhost:3000/login 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                rm -f .maintenance
                rm -rf .next.bak 2>/dev/null
                echo "Health OK"
                exit 0
              fi
            done

            echo "Health FAILED - rolling back"
            rm -rf .next-failed 2>/dev/null
            mv .next .next-failed
            if [ -d ".next.bak" ]; then
              mv .next.bak .next
            else
              echo "No backup — app may be down"
            fi
            rm -f .maintenance
            pm2 reload ecosystem.config.js --only sintak-prod
            exit 1
